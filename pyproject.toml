[project]
name = "rich-gradient"
description = "A gradient generator for the Rich library."
readme = "README.md"
authors = [{ name = "Max Ludden", email = "maxludden@me.com" }]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "requests>=2.32.5",
    "rich>=14.0.0",
    "rich-color-ext>=2.0.0",
]
dynamic = ["version"]


[project.urls]
Homepage = "https://github.com/maxludden/rich-gradient"
Documentation = "https://maxludden.github.io/rich-gradient"
Repository = "https://github.com/maxludden/rich-gradient"
Issues = "https://github.com/maxludden/rich-gradient/issues"
Changelog = "https://maxludden.github.io/rich-gradient/CHANGELOG/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
config = ["pydantic-settings>=2.11.0"]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.7",
    "mkdocstrings>=0.29.0",
    "mkdocstrings-python>=1.16.5",
    "mypy>=2.1.0",
    "pytest>=8.3.5",
    "pytest-benchmark>=5.1.0",
    "black>=24.3.0",
    "isort>=5.12.0",
    "pre-commit>=3.4.0",
]
toml = ["tomlkit>=0.13.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/rich_gradient"]

[tool.hatch.version]
path = "src/rich_gradient/__init__.py"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
]
ignore = [
    "E501", # Line too long in examples and legacy code
    "F401", # Unused imports
    "E741", # Ambiguous variable name
]

[tool.pylint.MESSAGES_CONTROL]
disable = [
    "C0103",                      # Variable name does not conform to snake_case
    "E0611",                      # No name in module
    "W0611",                      # Unused import
    "W0603",                      # allow `global` statement
    "W1401",                      # Anomalous backslash in string
    "R0914",                      # Too many local variables
    "W0212",                      # Access to a protected member of a client class
]

[tool.mypy]
# Project-level mypy configuration for incremental static typing checks
files = ["src"]
ignore_missing_imports = true

[tool.markdownlint]
disable = [
    "MD033", # Inline HTML
    "MD026", # Trailing punctuation in heading
]
