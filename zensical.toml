[project]
site_name = "rich-gradient"
site_description = "rich-gradient is a python package built on the great rich library that automates the generation of gradient colored rich renderables."
site_author = "Max Ludden"
site_url = "https://maxludden.github.io/rich-gradient/"
repo_name = "rich-gradient"
repo_url = "https://github.com/maxludden/rich-gradient"
edit_uri = "root/docs"

nav = [
    { "Getting Started" = "index.md" },
    { "User Guide" = [
        { "Text" = "text.md" },
        { "Gradient" = "gradient.md" },
        { "Panel" = "panel.md" },
        { "Rule" = "rule.md" },
        { "Convenience Renderables" = "renderables.md" },
        { "Table" = "table.md" },
        { "Tree" = "tree.md" },
        { "Columns" = "columns.md" },
        { "Pretty" = "pretty.md" },
        { "Syntax" = "syntax.md" },
        { "JSON" = "json.md" },
        { "ProgressBar" = "progress_bar.md" },
        { "Inspect" = "inspect.md" },
        { "Spectrum" = "spectrum.md" },
        { "Animation" = "animation.md" },
        { "Configuration" = "configuration.md" },
    ] },
    { "References" = [
        { "Animated Text Reference" = "animated_text_ref.md" },
        { "Animated Gradient Reference" = "animated_gradient_ref.md" },
        { "Animated Panel Reference" = "animated_panel_ref.md" },
        { "Columns Reference" = "columns_ref.md" },
        { "Gradient Reference" = "gradient_ref.md" },
        { "Inspect Reference" = "inspect_ref.md" },
        { "JSON Reference" = "json_ref.md" },
        { "Panel Reference" = "panel_ref.md" },
        { "Pretty Reference" = "pretty_ref.md" },
        { "ProgressBar Reference" = "progress_bar_ref.md" },
        { "Rule Reference" = "rule_ref.md" },
        { "Spectrum Reference" = "spectrum_ref.md" },
        { "Syntax Reference" = "syntax_ref.md" },
        { "Table Reference" = "table_ref.md" },
        { "Text Reference" = "text_ref.md" },
        { "Theme Reference" = "theme_ref.md" },
        { "Tree Reference" = "tree_ref.md" },
    ] },
    { "Changelog" = "CHANGELOG.md" },
]

# Variant, fonts, the gradient-dark/light palette and the feature list all come
# from the theme (zensical-gradient-theme); set them here only to replace them.
[project.theme]
name = "gradient"
logo = "img/rich-gradient-icon.svg"
favicon = "img/rich-gradient-icon.svg"

[project.plugins.mkdocstrings]

[project.extra]
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/maxludden" },
    { icon = "fontawesome/brands/python", link = "https://pypi.org/project/rich-gradient" },
]

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.tables]
